[advisories]
version = 2
yanked = "deny"

[bans]
# Optional integrations pull in their own dependency trees, so duplicates are only reported.
multiple-versions = "warn"
wildcards = "deny"
# `get-size-derive2` depends on `get-size2` by path, without a version, for its doctests.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[licenses]
version = 2
confidence-threshold = 0.93
allow = [
    "Apache-2.0",  # https://tldrlegal.com/license/apache-license-2.0-(apache-2.0)
    "MIT",         # https://tldrlegal.com/license/mit-license
    "Unicode-3.0", # https://spdx.org/licenses/Unicode-3.0.0.html
]
exceptions = []
