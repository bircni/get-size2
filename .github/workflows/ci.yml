name: CI

on:
  push:
    branches:
      - main
    tags:
      - "*"
  pull_request:
    branches:
      - main

jobs:
  typos:
    name: Typos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: crate-ci/typos@master

  cargo-machete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Machete
        uses: bnjbvr/cargo-machete@main

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [typos, cargo-machete]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ github.ref_name }}

      - name: Debug build
        run: cargo build

      - name: Release build
        run: cargo build --release
  
  cross-check:
    name: Cross-compile (no 64-bit atomics)
    runs-on: ubuntu-latest
    needs: [typos, cargo-machete]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # `powerpc-unknown-linux-gnu` is a 32-bit target without 64-bit atomics,
      # which regression-guards the conditional `AtomicI64`/`AtomicU64` impls (issue #54).
      - name: Add 32-bit target
        run: rustup target add powerpc-unknown-linux-gnu

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ github.ref_name }}

      - name: Check (default features)
        run: cargo check -p get-size2 --target powerpc-unknown-linux-gnu

      # The `portable-atomic` feature must provide `AtomicU64`/`AtomicI64`
      # (and 128-bit) on exactly these targets — verify it builds here.
      - name: Check (portable-atomic feature)
        run: cargo check -p get-size2 --features portable-atomic --target powerpc-unknown-linux-gnu

  check:
    name: Lint & Test
    runs-on: ubuntu-latest
    needs: [typos, cargo-machete]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ github.ref_name }}

      - name: Test
        run: cargo test --all

      - name: Format code
        run: cargo fmt --all -- --check

      - name: Lint code
        run: cargo clippy -- -D warnings

  tarpaulin:
    name: Tarpaulin Coverage
    runs-on: ubuntu-latest
    needs: [typos, cargo-machete]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ github.ref_name }}

      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin --locked

      - name: Verify coverage threshold
        run: >
          cargo tarpaulin
          --package get-size2
          --all-features
          --exclude-files '*/examples/*' '*/src/test.rs'
          --fail-under 90

  publish-check:
    name: Publish Check
    runs-on: ubuntu-latest
    needs: [build, check, tarpaulin]
    steps:
      - uses: actions/checkout@v6
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ github.ref_name }}
      - run: cargo fetch
      - name: cargo publish get-size2
        run: cargo publish --dry-run -p get-size2
      - name: cargo publish get-size2
        run: cargo publish --dry-run -p get-size-derive2


