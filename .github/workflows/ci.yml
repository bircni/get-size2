name: CI

on:
  push:
    branches:
      - main
    tags:
      - "*"
  pull_request:
    branches:
      - main

jobs:
  typos:
    name: Typos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: crate-ci/typos@master

  cargo-machete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Machete
        uses: bnjbvr/cargo-machete@main

  build:
    name: Build & Test (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs: [typos, cargo-machete]

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: 64-bit
            target: x86_64-unknown-linux-gnu
          # 32-bit target without 64-bit atomics. Regression-guards the
          # conditional `AtomicI64`/`AtomicU64` impls (#54) and the
          # pointer-width-sensitive heap sizes asserted in the tests (#56).
          - name: 32-bit
            target: powerpc-unknown-linux-gnu

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # Installs the Rust target plus a cross linker and a QEMU runner, so
      # `cargo test --target` both builds and *executes* the emulated 32-bit
      # binaries. A no-op wrapper for the native host target.
      - name: Set up toolchain
        uses: taiki-e/setup-cross-toolchain-action@v1
        with:
          target: ${{ matrix.target }}

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ github.ref_name }}-${{ matrix.target }}

      - name: Debug build
        run: cargo build --all-features --target ${{ matrix.target }}

      - name: Release build
        run: cargo build --release --all-features --target ${{ matrix.target }}

      - name: Test
        run: cargo test --all --all-features --target ${{ matrix.target }}

  check:
    name: Lint
    runs-on: ubuntu-latest
    needs: [typos, cargo-machete]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ github.ref_name }}-x86_64-unknown-linux-gnu

      - name: Format code
        run: cargo fmt --all -- --check

      - name: Lint code
        run: cargo clippy -- -D warnings

  tarpaulin:
    name: Tarpaulin Coverage
    runs-on: ubuntu-latest
    needs: [typos, cargo-machete]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ github.ref_name }}

      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin --locked

      - name: Verify coverage threshold
        run: >
          cargo tarpaulin
          --package get-size2
          --all-features
          --exclude-files '*/examples/*' '*/src/test.rs'
          --fail-under 90

  publish-check:
    name: Publish Check
    runs-on: ubuntu-latest
    needs: [build, check, tarpaulin]
    steps:
      - uses: actions/checkout@v6
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ github.ref_name }}
      - run: cargo fetch
      - name: cargo publish get-size2
        run: cargo publish --dry-run -p get-size2
      - name: cargo publish get-size2
        run: cargo publish --dry-run -p get-size-derive2


