name: CI

on:
  push:
    branches:
      - main
    tags:
      - "*"
  pull_request:
    branches:
      - main

# The jobs only read the repository, so the token does not need more than that.
permissions:
  contents: read

# A newer push to a pull request supersedes the runs of the previous one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  typos:
    name: Typos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: crate-ci/typos@276087d9a4f06398b3e04825487805e2d7375888 # v1.52.2

  cargo-machete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Machete
        uses: bnjbvr/cargo-machete@a84eadc0a20e522e37a502609e97a7ce30c998ed # v0.10.0

  cargo-deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # Checks the advisories, bans, licenses and sources configured in `deny.toml`.
      - uses: EmbarkStudios/cargo-deny-action@v2

  build:
    name: Build & Test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    needs: [typos, cargo-machete]

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: 64-bit
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          # 32-bit target without 64-bit atomics. Regression-guards the
          # conditional `AtomicI64`/`AtomicU64` impls (#54) and the
          # pointer-width-sensitive heap sizes asserted in the tests (#56).
          - name: 32-bit
            os: ubuntu-latest
            target: powerpc-unknown-linux-gnu
          # Native builds for the remaining tier 1 platforms, whose `OsString` and `PathBuf`
          # representations differ. They use the preinstalled host toolchain, so no target is
          # set.
          - name: macOS
            os: macos-latest
          - name: Windows
            os: windows-latest

    env:
      # Empty for the native builds, which then target their host.
      TARGET_FLAG: ${{ matrix.target && format('--target {0}', matrix.target) || '' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # Installs the Rust target plus a cross linker and a QEMU runner, so
      # `cargo test --target` both builds and *executes* the emulated 32-bit
      # binaries. A no-op wrapper for the native host target.
      - name: Set up toolchain
        if: matrix.target
        uses: taiki-e/setup-cross-toolchain-action@v1
        with:
          target: ${{ matrix.target }}

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ github.ref_name }}-${{ matrix.name }}

      # `shell: bash` keeps the unquoted `$TARGET_FLAG` expansion identical on Windows.
      - name: Debug build
        shell: bash
        run: cargo build --all-features $TARGET_FLAG

      - name: Release build
        shell: bash
        run: cargo build --release --all-features $TARGET_FLAG

      - name: Test
        shell: bash
        run: cargo test --all --all-features $TARGET_FLAG

  no-std:
    name: Build (no_std)
    runs-on: ubuntu-latest
    needs: [typos, cargo-machete]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # A bare metal target without `std`, so anything reaching for `std` fails to build.
      - name: Set up toolchain
        run: rustup target add thumbv7m-none-eabi

      - name: Install cargo-hack
        uses: taiki-e/install-action@cargo-hack

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ github.ref_name }}-thumbv7m-none-eabi

      # Builds the crate without any feature and then once per feature, so a newly added feature
      # cannot skip the no_std gate by being left out of `all-features-no-std`. Excluded are the
      # features which require `std`, plus the `all-features` combination they are part of.
      - name: Build every no_std compatible feature
        run: >
          cargo hack build -p get-size2 --each-feature --exclude-all-features
          --exclude-features default,std,dashmap,parking_lot --target thumbv7m-none-eabi

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    needs: [typos, cargo-machete]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # Keep in sync with `rust-version` in the workspace `Cargo.toml`.
      - name: Set up toolchain
        run: rustup toolchain install 1.85 --profile minimal

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ github.ref_name }}-msrv

      # The declared version covers the crates themselves. The optional integrations are left
      # out, since their dependencies raise their own minimum version independently of us.
      - name: Build without default features
        run: cargo +1.85 build -p get-size2 --no-default-features

      - name: Build with the derive macro
        run: cargo +1.85 build -p get-size2 --features derive

  docs:
    name: Docs
    runs-on: ubuntu-latest
    needs: [typos, cargo-machete]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # docs.rs builds with nightly and `--cfg docsrs`, which enables the `doc_cfg` feature.
      - name: Set up toolchain
        run: rustup toolchain install nightly --profile minimal

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ github.ref_name }}-docs

      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings --cfg docsrs
        run: cargo +nightly doc --all-features --no-deps

  check:
    name: Lint
    runs-on: ubuntu-latest
    needs: [typos, cargo-machete]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ github.ref_name }}-x86_64-unknown-linux-gnu

      - name: Format code
        run: cargo fmt --all -- --check

      - name: Lint code
        run: cargo clippy --all-targets --all-features -- -D warnings

  tarpaulin:
    name: Tarpaulin Coverage
    runs-on: ubuntu-latest
    needs: [typos, cargo-machete]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ github.ref_name }}

      - name: Install cargo-tarpaulin
        uses: taiki-e/install-action@cargo-tarpaulin

      - name: Verify coverage threshold
        run: >
          cargo tarpaulin
          --package get-size2
          --all-features
          --exclude-files 'crates/get-size2/examples/*' 'crates/get-size2/src/tests/*'
          --fail-under 90

  publish-check:
    name: Publish Check
    runs-on: ubuntu-latest
    needs: [typos, cargo-machete]
    steps:
      - uses: actions/checkout@v6
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ github.ref_name }}
      - run: cargo fetch
      - name: cargo publish get-size2
        run: cargo publish --dry-run -p get-size2
      - name: cargo publish get-size-derive2
        run: cargo publish --dry-run -p get-size-derive2
