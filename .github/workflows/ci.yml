name: CI

on:
  push:
    branches:
      - main
    tags:
      - "*"
  pull_request:
    branches:
      - main
  # New advisories and toolchain releases show up without anyone pushing, so everything also runs
  # once a week.
  schedule:
    - cron: "17 5 * * 1"

# The jobs only read the repository, so the token does not need more than that.
permissions:
  contents: read

# A newer push to a pull request supersedes the runs of the previous one. Every other run gets a
# group of its own, named after its ref and commit, so runs on `main`, of tags and of the
# schedule are never cancelled or dropped, not even a tag pushed for the commit `main` is at.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || format('{0}-{1}', github.ref, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  typos:
    name: Typos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: crate-ci/typos@276087d9a4f06398b3e04825487805e2d7375888 # v1.52.2

  cargo-machete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Machete
        uses: bnjbvr/cargo-machete@a84eadc0a20e522e37a502609e97a7ce30c998ed # v0.10.0

  cargo-deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Checks the advisories, bans, licenses and sources configured in `deny.toml`.
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1

  build:
    name: Build & Test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    needs: [typos, cargo-machete]

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: 64-bit
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          # 32-bit target without 64-bit atomics. Regression-guards the
          # conditional `AtomicI64`/`AtomicU64` impls (#54) and the
          # pointer-width-sensitive heap sizes asserted in the tests (#56).
          - name: 32-bit
            os: ubuntu-latest
            target: powerpc-unknown-linux-gnu
          # Native builds for the remaining tier 1 platforms, whose `OsString` and `PathBuf`
          # representations differ. They use the preinstalled host toolchain, so no target is
          # set.
          - name: macOS
            os: macos-latest
          - name: Windows
            os: windows-latest
          # Emulated targets on which hash tables scan their control bytes differently: 16 bytes
          # at once with LSX, and a plain machine word without SSE2. The allocator ground truth
          # test keeps the reconstructed table sizes honest on them.
          - name: LoongArch
            os: ubuntu-latest
            target: loongarch64-unknown-linux-gnu
          - name: x86 without SSE2
            os: ubuntu-latest
            target: i586-unknown-linux-gnu

    env:
      # Empty for the native builds, which then target their host.
      TARGET_FLAG: ${{ matrix.target && format('--target {0}', matrix.target) || '' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installs the Rust target plus a cross linker and a QEMU runner, so
      # `cargo test --target` both builds and *executes* the emulated 32-bit
      # binaries. A no-op wrapper for the native host target.
      - name: Set up toolchain
        if: matrix.target
        uses: taiki-e/setup-cross-toolchain-action@12b7ad4acfa95a1476779d6c06699b96ec1691f8 # v1.42.0
        with:
          target: ${{ matrix.target }}

      # The key only names the job. Caches are scoped by branch already, and a pull request falls
      # back to the cache of its base branch.
      - name: Cache dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ${{ matrix.name }}

      # `shell: bash` keeps the unquoted `$TARGET_FLAG` expansion identical on Windows.
      - name: Debug build
        shell: bash
        run: cargo build --all-features $TARGET_FLAG

      - name: Release build
        shell: bash
        run: cargo build --release --all-features $TARGET_FLAG

      - name: Test
        shell: bash
        run: cargo test --all --all-features --no-fail-fast $TARGET_FLAG

  no-std:
    name: Build (no_std)
    runs-on: ubuntu-latest
    needs: [typos, cargo-machete]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A bare metal target without `std`, so anything reaching for `std` fails to build.
      - name: Set up toolchain
        run: rustup target add thumbv7m-none-eabi

      - name: Install cargo-hack
        uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21 # v2.90.4
        with:
          tool: cargo-hack

      - name: Cache dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: thumbv7m-none-eabi

      # Builds the crate without any feature and then once per feature, so a newly added feature
      # cannot skip the no_std gate by being left out of `all-features-no-std`. Excluded are the
      # features which require `std`, plus the `all-features` combination they are part of.
      - name: Build every no_std compatible feature
        run: >
          cargo hack build -p get-size2 --each-feature --exclude-all-features
          --exclude-features default,std,dashmap,parking_lot --target thumbv7m-none-eabi

      # A target without atomic compare-and-swap: `alloc` provides no `Arc` there, and the
      # fallbacks of `portable-atomic` are unavailable. Most integrations do not support such a
      # target themselves, so only the tiers of this crate and the features meant for it are
      # built, in every combination.
      - name: Build for a target without compare-and-swap
        run: |
          rustup target add thumbv6m-none-eabi
          cargo build -p get-size2 --no-default-features --target thumbv6m-none-eabi
          cargo hack build -p get-size2 --feature-powerset \
            --include-features alloc,derive,portable-atomic,portable-atomic-critical-section --target thumbv6m-none-eabi

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    needs: [typos, cargo-machete]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Keep in sync with `rust-version` in the workspace `Cargo.toml`.
      - name: Set up toolchain
        run: rustup toolchain install 1.85 --profile minimal

      - name: Cache dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: msrv

      # The declared version covers the crates themselves. The optional integrations are left
      # out, since their dependencies raise their own minimum version independently of us.
      #
      # No lockfile is committed, so this builds against the newest `syn`, `quote` and
      # `attribute-derive`. Should one of them raise its minimum version, this job fails on an
      # unrelated change. That is intended: it is what users on that toolchain would hit as well.
      - name: Build without default features
        run: cargo +1.85 build -p get-size2 --no-default-features

      - name: Build with the derive macro
        run: cargo +1.85 build -p get-size2 --features derive

  docs:
    name: Docs
    runs-on: ubuntu-latest
    needs: [typos, cargo-machete]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # docs.rs builds with nightly and `--cfg docsrs`, which enables the `doc_cfg` feature.
      - name: Set up toolchain
        run: rustup toolchain install nightly --profile minimal

      - name: Cache dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: docs

      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings --cfg docsrs
        run: cargo +nightly doc --all-features --no-deps

  check:
    name: Lint
    runs-on: ubuntu-latest
    needs: [typos, cargo-machete]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: lint

      - name: Format code
        run: cargo fmt --all -- --check

      - name: Lint code
        run: cargo clippy --all-targets --all-features -- -D warnings

  tarpaulin:
    name: Tarpaulin Coverage
    runs-on: ubuntu-latest
    needs: [typos, cargo-machete]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: tarpaulin

      - name: Install cargo-tarpaulin
        uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21 # v2.90.4
        with:
          tool: cargo-tarpaulin

      - name: Verify coverage threshold
        run: >
          cargo tarpaulin
          --workspace
          --all-features
          --exclude-files 'crates/get-size2/examples/*'
          --fail-under 90

  wasi:
    name: Test (WASI)
    runs-on: ubuntu-latest
    needs: [typos, cargo-machete]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installs the target and `wasmtime` as its test runner.
      - name: Set up toolchain
        uses: taiki-e/setup-cross-toolchain-action@12b7ad4acfa95a1476779d6c06699b96ec1691f8 # v1.42.0
        with:
          target: wasm32-wasip1

      - name: Cache dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: wasi

      # WebAssembly has a table layout of its own and no threads, which the unit tests spawn.
      # The integration tests need none and compare the reported sizes with the allocator.
      - name: Test
        run: >
          cargo test -p get-size2 --all-features --target wasm32-wasip1
          --test allocation_ground_truth --test public_api

  miri:
    name: Miri
    runs-on: ubuntu-latest
    needs: [typos, cargo-machete]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up toolchain
        run: rustup toolchain install nightly --profile minimal --component miri

      - name: Cache dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: miri

      # The standard library selects a portable hash table implementation under Miri, which the
      # size reconstruction has to follow. The interpreter is slow, so only the integration
      # tests run, with their largest cases left out.
      - name: Test
        run: >
          cargo +nightly miri test -p get-size2 --all-features
          --test allocation_ground_truth --test public_api

  publish-check:
    name: Publish Check
    runs-on: ubuntu-latest
    needs: [typos, cargo-machete]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: publish
      - run: cargo fetch
      - name: cargo publish get-size2
        run: cargo publish --dry-run -p get-size2
      - name: cargo publish get-size-derive2
        run: cargo publish --dry-run -p get-size-derive2
