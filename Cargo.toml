[workspace]
resolver = "2"
members = ["crates/get-size2", "crates/get-size-derive2"]

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "MIT"
version = "0.11.1"
authors = ["Denis Kerp", "Nicolas"]

[workspace.dependencies]
# The lowest versions which resolve together with every optional integration, and which the
# test suite was run with. The derive macro itself gets by with older ones.
syn = "3.0.4"
get-size-derive2 = { version = "0.11.1", path = "crates/get-size-derive2" }
quote = "1.0.40"
proc-macro2 = "1.0.95"

[workspace.lints.rust]
unsafe_code = "deny"
# Set through `RUSTFLAGS` by users of `portable-atomic` on single core targets.
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(portable_atomic_unsafe_assume_single_core)',
] }
deprecated = "warn"
elided_lifetimes_in_paths = "warn"
rust_2021_prelude_collisions = "warn"
semicolon_in_expressions_from_macros = "warn"
trivial_numeric_casts = "warn"
unsafe_op_in_unsafe_fn = "warn"                         # `unsafe_op_in_unsafe_fn` may become the default in future Rust versions: https://github.com/rust-lang/rust/issues/71668
unused_extern_crates = "warn"
unused_import_braces = "warn"
unused_lifetimes = "warn"

[workspace.lints.rustdoc]
all = "warn"
missing_crate_level_docs = "warn"

[workspace.lints.clippy]
all = {level = "warn", priority = -1}
correctness = {level = "warn", priority = -1}
suspicious = {level = "warn", priority = -1}
style = {level = "warn", priority = -1}
complexity = {level = "warn", priority = -1}
perf = {level = "warn", priority = -1}
pedantic = {level = "warn", priority = -1}
nursery = {level = "warn", priority = -1}

needless_doctest_main = {level = "allow"}

# Additional lints from https://rust-lang.github.io/rust-clippy/master/index.html?groups=restriction
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
assertions_on_result_states = "warn"
create_dir = "warn"
clone_on_ref_ptr = "warn"
expect_used = "warn"
missing_assert_message = "warn"
panic_in_result_fn = "warn"
str_to_string = "warn"
todo = "warn"
unwrap_used = "warn"
unimplemented = "warn"
wildcard_enum_match_arm = "warn"
