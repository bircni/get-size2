[package]
name = "get-size2"
description = "Determine the size in bytes an object occupies inside RAM."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
readme = "README.md"
repository = "https://github.com/bircni/get-size2"
keywords = ["size", "heap", "ram", "memory", "get-size"]
categories = ["memory-management", "caching"]
exclude = ["examples/*", "tests/*"]

[lints]
workspace = true

[dependencies]
get-size-derive2 = { workspace = true, optional = true }

bytes = { version = "1", default-features = false, optional = true }
chrono = { version = "0.4", default-features = false, optional = true }
chrono-tz = { version = "0.10", default-features = false, optional = true }
compact_str = { version = "0.10", default-features = false, optional = true }
dashmap = { version = "6", default-features = false, optional = true }
half = { version = "2", default-features = false, optional = true }
hashbrown = { version = "0.17", default-features = false, optional = true }
indexmap = { version = "2.14", default-features = false, optional = true }
ordermap = { version = "1.2", default-features = false, optional = true }
orx-concurrent-vec = { version = "3.10", default-features = false, optional = true }
parking_lot = { version = "0.12", default-features = false, optional = true }
portable-atomic = { version = "1", default-features = false, features = [
    "fallback",
], optional = true }
roaring = { version = "0.11", default-features = false, optional = true }
smallvec = { version = "1", default-features = false, optional = true }
thin-vec = { version = "0.2", default-features = false, optional = true }
url = { version = "2", default-features = false, optional = true }

[dev-dependencies]
get-size2 = { path = ".", features = [
    "derive",
    "bytes",
    "chrono",
    "chrono-tz",
    "compact-str",
    "dashmap",
    "half",
    "hashbrown",
    "indexmap",
    "ordermap",
    "orx-concurrent-vec",
    "parking_lot",
    "portable-atomic",
    "roaring",
    "smallvec",
    "thin-vec",
    "url",
] }

[features]
default = []
derive = ["get-size-derive2"]

bytes = ["dep:bytes"]
chrono = ["dep:chrono"]
chrono-tz = ["dep:chrono-tz"]
compact-str = ["dep:compact_str"]
dashmap = ["dep:dashmap"]
half = ["dep:half"]
hashbrown = ["dep:hashbrown"]
indexmap = ["dep:indexmap"]
ordermap = ["dep:ordermap"]
orx-concurrent-vec = ["dep:orx-concurrent-vec"]
parking_lot = ["dep:parking_lot"]
portable-atomic = ["dep:portable-atomic"]
roaring = ["dep:roaring"]
smallvec = ["dep:smallvec"]
thin-vec = ["dep:thin-vec"]
url = ["dep:url"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
